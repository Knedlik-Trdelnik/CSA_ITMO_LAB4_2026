in_source: "цело swapped = 1;\nцело curr = 0;\nцело next = 0;\nцело v1 = 0;\nцело v2 = 0;\nцело keep_going = 1;\n\nmain;\n\
  di;\nграмота arr = \"edcba\";\n\nwhile ( swapped > 0 );\n    swapped = 0;\n    curr = arr;\n    keep_going = 1;\n\n    while\
  \ ( keep_going > 0 );\n        next = curr + 1;\n\n        v1 = читай_адрес(curr);\n        v2 = читай_адрес(next);\n\n\
  \        ; Если следующий символ 0 (конец массива), останавливаем внутренний цикл\n        if ( v2 == 0 );\n           \
  \ keep_going = 0;\n        if-end;\n\n        ; Если мы еще не в конце, проверяем, нужно ли менять местами\n        if (\
  \ v2 > 0 );\n            if ( v1 > v2 );\n                ; Меняем местами (swap)\n                пиши_адрес( curr , v2\
  \ );\n                пиши_адрес( next , v1 );\n                swapped = 1;\n            if-end;\n\n            curr =\
  \ curr + 1;\n        if-end;\n    while-end;\nwhile-end;\n\n\nпиши_строку( arr );\nпиши_память( 10 );\nmain-end;"
