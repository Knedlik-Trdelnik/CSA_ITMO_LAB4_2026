in_source: 'цело a = 1;

  trap io_handler;

  грамота c = читай_память;в порту появился символ — это событие модели

  if ( c == 10 );

  a = -1;

  if-end;

  if ( c > 10 );

  пиши_память( c ); процессор вошёл в обработчик — это реакция на событие

  if-end;

  trap-end;


  main;

  di;

  грамота q = "What is your name?";

  грамота w = "Hello, ";

  грамота e = "!";

  пиши_строку ( q );

  пиши_строку ( w );

  ei;

  while ( a > 0 );

  while-end;

  пиши_строку ( e );

  main-end;'
