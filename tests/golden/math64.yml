in_source: "цело a_high = 0;\nцело a_low = 2000000000;\n\nцело b_high = 0;\nцело b_low = 2000000000;\n\nцело res_high = 0;\n\
  цело res_low = 0;\n\n; Для проверки переноса мы используем деление (сдвиг).\n; Так как у вас есть операция деления \":\"\
  , мы можем эмулировать переполнение.\n; В 32-битном знаковом числе максимум это 2147483647.\n; Мы проверяем, не превысит\
  \ ли сумма это число.\n\nцело limit = 2147483647;\nцело diff = 0;\n\nmain;\ndi;\n\n; Пытаемся сложить младшие части\ndiff\
  \ = limit - a_low;\n\nif ( b_low > diff );\n    ; Произошло переполнение!\n    ; Увеличиваем старшую часть на 1\n    res_high\
  \ = a_high + b_high + 1;\n\n    ; Высчитываем, сколько \"осталось\" в младшей части\n    ; В реальности это сложная битовая\
  \ магия, но для алгоритмики достаточно показать логику:\n    res_low = b_low - diff - 1;\nif-end;\n\nif ( diff > b_low );\n\
  \    ; Переполнения нет\n    res_high = a_high + b_high;\n    res_low = a_low + b_low;\nif-end;\n\nif ( diff == b_low );\n\
  \    ; Переполнения нет\n    res_high = a_high + b_high;\n    res_low = a_low + b_low;\nif-end;\n\n; Выводим результат (должно\
  \ получиться res_high=1, res_low=1852516352)\n; Так как у нас нет print_num, выведем в порты буквы как \"ОК\" или просто\
  \ оставим в памяти.\n; Особенность вашего варианта - результат вычислений проверяется по дампу памяти или журналу.\n; Поэтому\
  \ мы просто выведем букву \"D\" (Done)\n\nпиши_память( 68 ); ; 68 = 'D'\nпиши_память( 10 );\nmain-end;"
