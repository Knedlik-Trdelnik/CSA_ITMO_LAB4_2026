in_source: 'цело is_running = 1;


  trap io_handler;

  грамота c = читай_память();


  ; Если пришел символ конца строки (10), останавливаем цикл

  if ( c == 10 );

  is_running = 0;

  if-end;



  пиши_память( c );



  trap-end;


  main;

  ei;


  ; Бесконечный цикл, пока не придет сигнал остановки (0)

  while ( is_running > 0 );

  while-end;


  main-end;'
in_stdin: Cat is working!
